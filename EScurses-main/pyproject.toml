[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escurses"
version = "0.2.0"
description = "A lightweight, zero-dependency terminal game library with double buffering and diff rendering"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "KID194" }]
keywords = ["terminal", "tui", "game", "ascii", "ansi", "curses"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KID194/EScurses"

[tool.setuptools]
packages = ["escurses"]

[tool.setuptools.package-data]
escurses = ["py.typed"]
